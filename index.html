<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Thumbnail Maker - By Buana Media</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#09090b',
            cardbg: '#18181b',
            bordercolor: '#27272a',
            accent: '#f59e0b',
            accenthover: '#d97706',
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090b;
      color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-zinc-950 text-zinc-100 selection:bg-amber-500 selection:text-zinc-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PRESET_TEMPLATES = [
      {
        id: 'affiliate',
        name: 'Affiliate Marketing',
        icon: 'fa-solid fa-money-bill-wave',
        title: 'RAHASIA AFFILIATE SHOPEE TANPA MODAL',
        subtitle: '100% Gratis Untuk Pemula',
        style: 'Viral YouTube (Warna Mencolok)',
        fontStyle: 'Bold Impact',
        color: '#FF0055',
        bgInstruction: 'Latar belakang toko online futuristik dengan paket Shopee & TikTok Shop berterbangan, aura cuan uang berhamburan',
        elements: ['Panah merah', 'Uang', 'Produk Shopee'],
        expression: 'Sangat Kaget',
        outfit: 'Asli / Sesuai Foto',
        position: 'Kiri'
      },
      {
        id: 'ibadah',
        name: 'Ibadah & Ceramah',
        icon: 'fa-solid fa-mosque',
        title: 'RAHASIA HIDUP TENANG & BERKAH',
        subtitle: 'Kajian Spesial & Ceramah Menyentuh Hati',
        style: 'Spiritual / Keagamaan',
        fontStyle: 'Modern',
        color: '#10B981',
        bgInstruction: 'Serene glowing mosque architecture with warm golden interior lighting',
        elements: ['Lingkaran merah', 'Kilat'],
        expression: 'Khusyuk & Damai',
        outfit: 'Baju Koko & Peci',
        position: 'Kiri'
      },
      {
        id: 'crypto',
        name: 'Crypto & Finance',
        icon: 'fa-solid fa-chart-line',
        title: 'CARA CUAN $1,000 DARI CRYPTO 2026',
        subtitle: 'Strategi Low Risk High Return',
        style: 'Finance',
        fontStyle: 'Tech',
        color: '#10B981',
        bgInstruction: 'Glowing dark green financial chart with soaring Bitcoin graphics',
        elements: ['Grafik naik', 'Uang'],
        expression: 'Antusias',
        outfit: 'Jas / Formal Executive',
        position: 'Kanan'
      },
      {
        id: 'ai_tools',
        name: 'AI Tools & Tech',
        icon: 'fa-solid fa-robot',
        title: 'AI RAHASIA BIKIN VIDEO DENGAN 1 KLIK',
        subtitle: 'Bikin Content Auto Viral!',
        style: 'Technology',
        fontStyle: 'Modern',
        color: '#6366F1',
        bgInstruction: 'Cyberpunk neon studio with glowing holographic AI robot face',
        elements: ['AI Robot', 'Kilat', 'Laptop'],
        expression: 'Antusias',
        outfit: 'Cyberpunk Armor',
        position: 'Kiri'
      }
    ];

    const EXTRA_ELEMENTS = [
      { id: 'Panah merah', label: 'Panah Merah', icon: 'fa-solid fa-arrow-right text-red-500' },
      { id: 'Lingkaran merah', label: 'Lingkaran Merah', icon: 'fa-solid fa-bullseye text-red-500' },
      { id: 'Uang', label: 'Hujan Uang', icon: 'fa-solid fa-dollar-sign text-emerald-500' },
      { id: 'Api', label: 'Efek Api', icon: 'fa-solid fa-fire text-amber-500' },
      { id: 'Kilat', label: 'Efek Kilat', icon: 'fa-solid fa-bolt text-yellow-400' },
      { id: 'Grafik naik', label: 'Grafik Naik', icon: 'fa-solid fa-chart-line text-green-500' },
      { id: 'Produk Shopee', label: 'Produk Shopee', icon: 'fa-solid fa-bag-shopping text-orange-500' },
      { id: 'Produk TikTok Shop', label: 'TikTok Shop', icon: 'fa-solid fa-bag-shopping text-pink-500' },
      { id: 'Laptop', label: 'Laptop Modern', icon: 'fa-solid fa-laptop text-blue-400' },
      { id: 'Smartphone', label: 'Smartphone', icon: 'fa-solid fa-mobile-screen-button text-purple-400' },
      { id: 'AI Robot', label: 'AI Robot / Cyber', icon: 'fa-solid fa-robot text-cyan-400' },
      { id: 'Ikon YouTube', label: 'Badge YouTube', icon: 'fa-brands fa-youtube text-red-600' }
    ];

    function App() {
      const [title, setTitle] = useState("RAHASIA AFFILIATE SHOPEE TANPA MODAL");
      const [subtitle, setSubtitle] = useState("100% Gratis Untuk Pemula");
      const [aspectRatio, setAspectRatio] = useState("16:9");
      const [style, setStyle] = useState("Viral YouTube");
      const [bgInstruction, setBgInstruction] = useState("Latar belakang toko online futuristik dengan paket Shopee & TikTok Shop berterbangan, aura cuan uang berhamburan");
      const [fontStyle, setFontStyle] = useState("Bold Impact");
      const [dominantColor, setDominantColor] = useState("#FF0055");
      const [personPosition, setPersonPosition] = useState("Kiri");
      const [expression, setExpression] = useState("Sangat Kaget");
      const [personOutfit, setPersonOutfit] = useState("Asli / Sesuai Foto");

      const [selectedElements, setSelectedElements] = useState(["Panah merah", "Uang", "Produk Shopee"]);
      const [customElementInput, setCustomElementInput] = useState("");

      const [generatedPrompt, setGeneratedPrompt] = useState("");
      const [generatedImageUrl, setGeneratedImageUrl] = useState("");
      const [isGeneratingPrompt, setIsGeneratingPrompt] = useState(false);
      const [isGeneratingImage, setIsGeneratingImage] = useState(false);
      const [activeTab, setActiveTab] = useState("editor");

      const toggleElement = (elemId) => {
        if (selectedElements.includes(elemId)) {
          setSelectedElements(selectedElements.filter(i => i !== elemId));
        } else {
          setSelectedElements([...selectedElements, elemId]);
        }
      };

      const handleAddCustomElement = (e) => {
        e?.preventDefault();
        if (!customElementInput.trim()) return;
        if (!selectedElements.includes(customElementInput.trim())) {
          setSelectedElements([...selectedElements, customElementInput.trim()]);
        }
        setCustomElementInput("");
      };

      const applyPreset = (preset) => {
        setTitle(preset.title);
        setSubtitle(preset.subtitle);
        setStyle(preset.style);
        setFontStyle(preset.fontStyle);
        setDominantColor(preset.color);
        setBgInstruction(preset.bgInstruction);
        setSelectedElements(preset.elements);
        setExpression(preset.expression);
        setPersonOutfit(preset.outfit);
        setPersonPosition(preset.position);
      };

      const handleGeneratePrompt = () => {
        setIsGeneratingPrompt(true);
        setTimeout(() => {
          setGeneratedPrompt(`High-CTR YouTube thumbnail design. Main Title "${title}" in giant bold ${fontStyle} text with black drop shadow and ${dominantColor} glowing stroke. ${personPosition} side features a person with ${expression} expression wearing ${personOutfit}. Background: ${bgInstruction}. Includes ${selectedElements.join(", ")}. Dramatic lighting, vibrant contrast, 8k quality, masterpiece.`);
          setIsGeneratingPrompt(false);
        }, 800);
      };

      const handleGenerateThumbnail = () => {
        if (!generatedPrompt) handleGeneratePrompt();
        setIsGeneratingImage(true);
        setTimeout(() => {
          const canvas = document.createElement('canvas');
          canvas.width = 1280; canvas.height = 720;
          const ctx = canvas.getContext('2d');
          
          const bgGrad = ctx.createLinearGradient(0, 0, 1280, 720);
          bgGrad.addColorStop(0, '#0f172a');
          bgGrad.addColorStop(0.5, dominantColor);
          bgGrad.addColorStop(1, '#09090b');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 1280, 720);

          ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 20;
          ctx.font = '900 64px sans-serif'; ctx.fillStyle = '#FFDD00';
          ctx.fillText(title.toUpperCase(), 80, 360);

          setGeneratedImageUrl(canvas.toDataURL('image/png'));
          setIsGeneratingImage(false);
        }, 1000);
      };

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col">
          
          {/* Top Navbar */}
          <header className="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-md sticky top-0 z-40 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 via-rose-500 to-indigo-600 p-[2px] flex items-center justify-center shadow-lg shadow-amber-500/10">
                <div className="w-full h-full bg-zinc-950 rounded-[10px] flex items-center justify-center">
                  <i className="fa-solid fa-wand-magic-sparkles text-amber-400 text-sm"></i>
                </div>
              </div>
              <div>
                <h1 className="text-lg font-black tracking-tight bg-gradient-to-r from-amber-400 via-rose-300 to-indigo-300 bg-clip-text text-transparent">
                  AI Thumbnail Maker
                </h1>
                <p className="text-[11px] text-zinc-400 font-medium leading-none">Create Viral Thumbnails with AI</p>
              </div>
            </div>

            {/* Nav Tabs Center */}
            <div className="flex items-center bg-zinc-900 p-1 rounded-xl border border-zinc-800 text-xs font-semibold">
              <button
                onClick={() => setActiveTab('editor')}
                className={`flex items-center gap-2 px-4 py-1.5 rounded-lg transition-all ${activeTab === 'editor' ? 'bg-amber-500 text-zinc-950 font-bold shadow' : 'text-zinc-400 hover:text-zinc-200'}`}
              >
                <i className="fa-solid fa-wand-magic-sparkles"></i> Studio Editor
              </button>
              <button
                onClick={() => setActiveTab('templates')}
                className={`flex items-center gap-2 px-4 py-1.5 rounded-lg transition-all ${activeTab === 'templates' ? 'bg-amber-500 text-zinc-950 font-bold shadow' : 'text-zinc-400 hover:text-zinc-200'}`}
              >
                <i className="fa-solid fa-layer-group"></i> Presets & Templates
              </button>
              <button
                onClick={() => setActiveTab('history')}
                className={`flex items-center gap-2 px-4 py-1.5 rounded-lg transition-all ${activeTab === 'history' ? 'bg-amber-500 text-zinc-950 font-bold shadow' : 'text-zinc-400 hover:text-zinc-200'}`}
              >
                <i className="fa-solid fa-clock-rotate-left"></i> History (0)
              </button>
            </div>

            <div className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-lg text-xs font-medium text-zinc-400">
              <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span>Google Gemini AI Ready</span>
            </div>
          </header>

          {/* Main Grid Workspace - 3 COLUMNS EXACT MATCH */}
          <main className="flex-1 max-w-[1800px] w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-5">
            
            {/* COLUMN 1: LEFT SIDEBAR (Col 3) */}
            <div className="lg:col-span-3 space-y-4">
              
              {/* Quick Start Panel */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-xs text-zinc-200 flex items-center gap-2">
                    <i className="fa-solid fa-bolt text-amber-400"></i> Template Quick Start
                  </h3>
                  <button onClick={() => setActiveTab('templates')} className="text-[11px] text-amber-400 hover:underline font-semibold">Lihat Semua</button>
                </div>
                <div className="space-y-2">
                  {PRESET_TEMPLATES.map((tmpl) => (
                    <button
                      key={tmpl.id}
                      onClick={() => applyPreset(tmpl)}
                      className="w-full text-left p-2.5 bg-zinc-950/70 hover:bg-zinc-800 border border-zinc-800 rounded-xl transition-all flex items-center gap-3 group"
                    >
                      <i className={`${tmpl.icon} text-amber-400 text-base`}></i>
                      <div className="overflow-hidden">
                        <div className="font-bold text-xs text-zinc-200 group-hover:text-amber-400 transition-colors">{tmpl.name}</div>
                        <div className="text-[10px] text-zinc-500 truncate">{tmpl.title}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              {/* Upload Boxes Panel */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-4">
                <h3 className="font-bold text-xs text-zinc-200 flex items-center gap-2">
                  <i className="fa-solid fa-user text-amber-400"></i> Upload & Pengaturan Foto / Logo
                </h3>

                {/* Upload Foto Profil */}
                <div className="space-y-2 border border-zinc-800 p-3 rounded-xl bg-zinc-950/40">
                  <div className="flex items-center justify-between">
                    <label className="text-[11px] font-bold text-zinc-300">Foto Profil / Orang (Opsional)</label>
                    <span className="text-[9px] px-1.5 py-0.5 rounded font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30">✨ AI Auto Adjust</span>
                  </div>
                  <div className="border border-dashed border-zinc-800 hover:border-amber-500/50 bg-zinc-950 rounded-xl p-4 text-center cursor-pointer transition-all">
                    <i className="fa-solid fa-cloud-arrow-up text-zinc-500 text-base mb-1"></i>
                    <p className="text-[11px] font-semibold text-zinc-300">Upload Foto Profil Orang</p>
                  </div>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <div>
                      <label className="block text-[10px] font-bold text-zinc-400 mb-0.5">Pakaian / Outfit AI</label>
                      <select value={personOutfit} onChange={(e) => setPersonOutfit(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-1.5 text-[11px] text-zinc-200">
                        <option value="Asli / Sesuai Foto">Asli / Sesuai Foto</option>
                        <option value="Baju Koko & Peci">Baju Koko & Peci</option>
                        <option value="Jas / Formal Executive">Jas / Formal Executive</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-zinc-400 mb-0.5">Ekspresi Wajah</label>
                      <select value={expression} onChange={(e) => setExpression(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-1.5 text-[11px] text-zinc-200">
                        <option value="Sangat Kaget">Sangat Kaget</option>
                        <option value="Khusyuk & Damai">Khusyuk & Damai</option>
                        <option value="Antusias">Antusias</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* Upload Logo */}
                <div className="space-y-2 border border-zinc-800 p-3 rounded-xl bg-zinc-950/40">
                  <div className="flex items-center justify-between">
                    <label className="text-[11px] font-bold text-zinc-300">Upload Logo Channel / Brand</label>
                    <span className="text-[9px] px-1.5 py-0.5 rounded font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30">✨ AI Auto</span>
                  </div>
                  <div className="border border-dashed border-zinc-800 hover:border-zinc-700 bg-zinc-950 rounded-xl p-2.5 text-center cursor-pointer text-xs text-zinc-400">
                    + Tambah Logo Channel / Brand
                  </div>
                </div>

                {/* Upload Produk */}
                <div className="space-y-2 border border-zinc-800 p-3 rounded-xl bg-zinc-950/40">
                  <div className="flex items-center justify-between">
                    <label className="text-[11px] font-bold text-zinc-300">Upload Gambar Produk (Maks 5)</label>
                    <span className="text-[9px] px-1.5 py-0.5 rounded font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30">✨ AI Auto</span>
                  </div>
                  <div className="border border-dashed border-zinc-800 hover:border-amber-500/50 bg-zinc-950 rounded-xl p-2.5 text-center cursor-pointer text-xs text-zinc-300 font-semibold flex items-center justify-center gap-1">
                    <i className="fa-solid fa-bag-shopping text-amber-400"></i> + Upload Gambar Produk
                  </div>
                </div>
              </div>
            </div>

            {/* COLUMN 2: MIDDLE FORM CONTROLS (Col 5) */}
            <div className="lg:col-span-5 space-y-4">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
                
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <h2 className="font-bold text-xs text-zinc-100 flex items-center gap-2">
                    <i className="fa-solid fa-font text-amber-400"></i> Pengaturan Teks & Judul
                  </h2>
                  <button className="px-3 py-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg text-[11px] font-bold flex items-center gap-1.5">
                    <i className="fa-solid fa-wand-magic-sparkles"></i> Smart Title Analysis
                  </button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-zinc-300 mb-1">Judul Utama Thumbnail <span className="text-rose-500">*</span></label>
                  <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-xs font-bold text-zinc-100 outline-none" />
                </div>

                <div>
                  <label className="block text-xs font-bold text-zinc-400 mb-1">Sub Judul (Opsional)</label>
                  <input type="text" value={subtitle} onChange={(e) => setSubtitle(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl px-3.5 py-2 text-xs text-zinc-200 outline-none" />
                </div>

                {/* Aspect Ratio Cards */}
                <div>
                  <label className="block text-xs font-bold text-zinc-300 mb-1.5">Rasio Thumbnail Platform</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { label: 'YouTube 16:9', val: '16:9', size: '1280x720' },
                      { label: 'Shorts 9:16', val: '9:16', size: '1080x1920' },
                      { label: 'Instagram 1:1', val: '1:1', size: '1080x1080' },
                      { label: 'Facebook 4:5', val: '4:5', size: '1080x1350' },
                      { label: 'Custom', val: 'Custom', size: 'Bebas' }
                    ].map((item) => (
                      <button
                        key={item.val}
                        type="button"
                        onClick={() => setAspectRatio(item.val)}
                        className={`p-2 rounded-xl text-left border text-xs font-bold transition-all ${aspectRatio === item.val ? 'bg-amber-500/10 border-amber-500 text-amber-400' : 'bg-zinc-950 border-zinc-800 text-zinc-400'}`}
                      >
                        <div>{item.label}</div>
                        <div className="text-[9px] text-zinc-500 font-mono">{item.size}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 mb-1">Gaya Visual Thumbnail</label>
                    <select value={style} onChange={(e) => setStyle(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-semibold text-zinc-200 outline-none">
                      <option value="Viral YouTube (Warna Mencolok)">Viral YouTube (Warna Mencolok)</option>
                      <option value="Spiritual / Keagamaan">Spiritual / Keagamaan</option>
                      <option value="Finance">Finance & Crypto</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 mb-1">Font Typography</label>
                    <select value={fontStyle} onChange={(e) => setFontStyle(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-semibold text-zinc-200 outline-none">
                      <option value="Bold Impact">Bold Impact</option>
                      <option value="Modern">Modern Sans</option>
                    </select>
                  </div>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="block text-xs font-bold text-zinc-300">Instruksi Latar Belakang (Background Prompt)</label>
                    <button type="button" className="px-2.5 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg text-[10px] font-bold">✨ AI Auto Background</button>
                  </div>
                  <textarea rows={2} value={bgInstruction} onChange={(e) => setBgInstruction(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs text-zinc-200 outline-none"></textarea>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 mb-1">Warna Aksen Dominan</label>
                    <div className="flex items-center gap-2 bg-zinc-950 border border-zinc-800 p-1.5 rounded-xl">
                      <input type="color" value={dominantColor} onChange={(e) => setDominantColor(e.target.value)} className="w-6 h-6 rounded cursor-pointer bg-transparent border-0" />
                      <span className="text-xs font-mono font-bold text-zinc-200">{dominantColor}</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-zinc-400 mb-1">Posisi Orang</label>
                    <select value={personPosition} onChange={(e) => setPersonPosition(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs font-semibold text-zinc-200 outline-none">
                      <option value="Kiri">Kiri</option>
                      <option value="Tengah">Tengah</option>
                      <option value="Kanan">Kanan</option>
                    </select>
                  </div>
                </div>

                {/* Visual Elements Hooks */}
                <div>
                  <label className="block text-xs font-bold text-zinc-300 mb-2">Elemen Tambahan Visual Hook (Preset & Manual Ketik)</label>
                  <form onSubmit={handleAddCustomElement} className="flex gap-2 mb-2">
                    <input type="text" value={customElementInput} onChange={(e) => setCustomElementInput(e.target.value)} placeholder="Ketik elemen visual hook sendiri (cth: Kitab Suci, Efek Cahaya)..." className="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-1.5 text-xs text-zinc-100 outline-none" />
                    <button type="submit" className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold rounded-xl">+ Tambah</button>
                  </form>
                  <div className="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto pr-1">
                    {EXTRA_ELEMENTS.map((item) => {
                      const isChecked = selectedElements.includes(item.id);
                      return (
                        <button key={item.id} type="button" onClick={() => toggleElement(item.id)} className={`flex items-center gap-2 p-2 rounded-xl text-xs font-semibold border transition-all ${isChecked ? 'bg-amber-500/10 border-amber-500/60 text-zinc-100' : 'bg-zinc-950 border-zinc-800 text-zinc-500'}`}>
                          <div className={`w-3.5 h-3.5 rounded flex items-center justify-center ${isChecked ? 'bg-amber-500 text-zinc-950' : 'border border-zinc-700'}`}>{isChecked && <i className="fa-solid fa-check text-[9px]"></i>}</div>
                          <i className={item.icon}></i>
                          <span className="truncate">{item.label}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Action Buttons */}
                <div className="pt-2 grid grid-cols-2 gap-3">
                  <button onClick={handleGeneratePrompt} disabled={isGeneratingPrompt} className="py-3 px-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-100 font-extrabold rounded-xl text-xs flex items-center justify-center gap-2">
                    <i className="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                    <span>Tahap 1: Generate Prompt AI</span>
                  </button>

                  <button onClick={handleGenerateThumbnail} disabled={isGeneratingImage} className="py-3 px-4 bg-gradient-to-r from-amber-500 via-rose-500 to-indigo-600 hover:opacity-90 text-zinc-950 font-black rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20">
                    <i className="fa-solid fa-sparkles text-zinc-950"></i>
                    <span>Tahap 2: Generate Thumbnail</span>
                  </button>
                </div>

              </div>
            </div>

            {/* COLUMN 3: RIGHT PREVIEW PANEL (Col 4) */}
            <div className="lg:col-span-4 space-y-4">
              
              {/* Output Canvas Preview */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-xs text-zinc-100 flex items-center gap-2">
                    <i className="fa-solid fa-image text-amber-400"></i> Hasil Thumbnail AI
                  </h3>
                </div>

                <div className="relative aspect-video bg-zinc-950 border border-zinc-800 rounded-xl overflow-hidden flex items-center justify-center">
                  {isGeneratingImage ? (
                    <div className="text-center p-4">
                      <i className="fa-solid fa-spinner animate-spin text-amber-400 text-xl mb-2"></i>
                      <p className="text-xs text-zinc-400">Memproses rendering thumbnail...</p>
                    </div>
                  ) : generatedImageUrl ? (
                    <img src={generatedImageUrl} alt="Thumbnail Result" className="w-full h-full object-cover" />
                  ) : (
                    <div className="text-center p-6 text-zinc-500">
                      <i className="fa-solid fa-image text-3xl mb-2 opacity-30"></i>
                      <p className="text-xs font-medium text-zinc-400">Belum ada thumbnail yang dibuat</p>
                      <p className="text-[10px] text-zinc-600 mt-0.5">Klik 'Tahap 2: Generate Thumbnail' untuk mulai</p>
                    </div>
                  )}
                </div>
              </div>

              {/* Output Prompt Box */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-xs text-zinc-200 flex items-center gap-2">
                    <i className="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Output Prompt AI
                  </h3>
                  <div className="flex items-center gap-1.5">
                    <button className="px-2.5 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 rounded-lg text-[10px] font-bold flex items-center gap-1">
                      <i className="fa-solid fa-bolt text-[9px]"></i> Boost
                    </button>
                    <button className="px-2.5 py-1 bg-zinc-800 text-zinc-300 rounded-lg text-[10px] font-bold flex items-center gap-1">
                      <i className="fa-solid fa-copy text-[9px]"></i> Copy
                    </button>
                  </div>
                </div>

                <textarea
                  readOnly
                  rows={4}
                  value={generatedPrompt}
                  placeholder="Klik 'Tahap 1: Generate Prompt AI' untuk melihat prompt terperinci yang dibuat oleh Google Gemini..."
                  className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs font-mono text-zinc-400 outline-none resize-none"
                />
              </div>

            </div>

          </main>

          {/* Footer */}
          <footer className="border-t border-zinc-800/80 py-4 px-6 text-center text-xs text-zinc-500 mt-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <div><span className="font-bold text-zinc-400">AI Thumbnail Maker</span> &copy; 2026. Powered by Google Gemini.</div>
            <div>
              <a href="https://www.buanamedia.my.id" target="_blank" rel="noopener noreferrer" className="text-amber-400 font-bold hover:underline">By Buana Media <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i></a>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
