        if (iconRef.current) {
          iconRef.current.innerHTML = '';
          const iconNode = lucide.createIcons({
            icons: { [name]: true },
            nameAttr: 'data-lucide'
          });
          const svg = document.createElement('i');
          svg.setAttribute('data-lucide', name);
          if (className) svg.className = className;
          iconRef.current.appendChild(svg);
          lucide.createIcons();
        }
      }, [name, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center" {...props} />;

    async function callGeminiAPI(payload, endpoint) {
      const apiKey = ""; // Managed by runtime
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${endpoint}:generateContent?key=${apiKey}`;

      let attempts = 0;
      const maxAttempts = 3;
      let delay = 1000;

      while (attempts < maxAttempts) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`API error (${response.status}): ${errorText}`);
          }

          const result = await response.json();
          return result;
        } catch (err) {
          attempts++;
          if (attempts >= maxAttempts) throw err;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
    }

      const handleGenerateThumbnail = async () => {
        let currentPrompt = generatedPrompt;
        if (!currentPrompt) {
          setIsGeneratingPrompt(true);
          await handleGeneratePrompt();
          currentPrompt = generatedPrompt;
        }

        setIsGeneratingImage(true);
        setErrorMessage("");

        try {
          let apiAspectRatio = "16:9";
          if (aspectRatio === "9:16") apiAspectRatio = "9:16";
          else if (aspectRatio === "1:1") apiAspectRatio = "1:1";
          else if (aspectRatio === "4:5") apiAspectRatio = "4:5";
          else if (aspectRatio === "16:9") apiAspectRatio = "16:9";

          const promptParts = [
            {
              text: `Create a professional, highly viral YouTube thumbnail image based on this exact prompt:\n\n${currentPrompt}\n\nKey instruction: High visual impact, bold title emphasis, crystal clear subject.`
            }
          ];

          if (personImage) {
            const base64Data = personImage.split(',')[1];
            const mimeMatch = personImage.match(/data:(.*?);base64/);
            const mimeType = mimeMatch ? mimeMatch[1] : 'image/png';

            promptParts.push({
              inlineData: {
                mimeType: mimeType,
                data: base64Data
              }
            });
            promptParts.push({
              text: "FACE PRESERVATION MANDATE: Use the person in the provided input image as the main subject. Retain the person's exact face structure, identity, skin tone, hairstyle, and facial features. Adapt their pose and extreme expression to fit the thumbnail prompt seamlessly."
            });
          }

          if (logoImage) {
            const base64Data = logoImage.split(',')[1];
            const mimeMatch = logoImage.match(/data:(.*?);base64/);
            const mimeType = mimeMatch ? mimeMatch[1] : 'image/png';

            promptParts.push({
              inlineData: {
                mimeType: mimeType,
                data: base64Data
              }
            });
            promptParts.push({
              text: "EXACT BRAND LOGO MANDATE: Keep and preserve the attached brand logo graphic exactly as uploaded. Do not modify, re-draw, or replace the logo graphic itself. Automatically position and scale the logo cleanly in an optimal corner (e.g. Top-Right or Top-Left) with appropriate padding and visual contrast."
            });
          }

          if (productImages.length > 0) {
            productImages.forEach((prodImg) => {
              const base64Data = prodImg.split(',')[1];
              const mimeMatch = prodImg.match(/data:(.*?);base64/);
              const mimeType = mimeMatch ? mimeMatch[1] : 'image/png';

              promptParts.push({
                inlineData: {
                  mimeType: mimeType,
                  data: base64Data
                }
              });
            });
            promptParts.push({
              text: `PRODUCT INTEGRATION MANDATE: Seamlessly incorporate the ${productImages.length} attached product image(s) into the thumbnail design. Render the product(s) cleanly with sharp detail, professional lighting, and subtle ambient shadows.`
            });
          }

          const payload = {
            contents: [
              {
                role: 'user',
                parts: promptParts
              }
            ],
            generationConfig: {
              responseModalities: ['TEXT', 'IMAGE'],
              imageConfig: {
                aspectRatio: apiAspectRatio
              }
            }
          };

          const result = await callGeminiAPI(payload, "gemini-3.1-flash-image");
          const candidatePart = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
          
          if (candidatePart && candidatePart.inlineData) {
            const generatedBase64 = `data:${candidatePart.inlineData.mimeType};base64,${candidatePart.inlineData.data}`;
            setGeneratedImageUrl(generatedBase64);
            saveToHistory(generatedBase64, currentPrompt);
          } else {
            throw new Error("API did not return a valid image block.");
          }

        } catch (err) {
          console.error("Image Generation Error:", err);
          setErrorMessage("Rendering via local high-speed graphics canvas fallback...");
          createCanvasFallbackThumbnail(currentPrompt);
        } finally {
          setIsGeneratingImage(false);
        }
      };

      const createCanvasFallbackThumbnail = (promptText) => {
        const canvas = document.createElement('canvas');
        let width = 1280;
        let height = 720;

        if (aspectRatio === "9:16") { width = 1080; height = 1920; }
        else if (aspectRatio === "1:1") { width = 1080; height = 1080; }
        else if (aspectRatio === "4:5") { width = 1080; height = 1350; }
        else if (aspectRatio === "Custom") { width = customWidth; height = customHeight; }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        // Background Gradient
        const bgGrad = ctx.createLinearGradient(0, 0, width, height);
        bgGrad.addColorStop(0, '#0f172a');
        bgGrad.addColorStop(0.5, dominantColor);
        bgGrad.addColorStop(1, '#020617');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // Decorative grid lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 3;
        for (let x = 0; x < width; x += 80) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }

        // Radial lighting glow
        const glowGrad = ctx.createRadialGradient(width * 0.7, height * 0.5, 50, width * 0.7, height * 0.5, width * 0.4);
        glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
        glowGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(width * 0.7, height * 0.5, width * 0.4, 0, Math.PI * 2);
        ctx.fill();

        if (personImage) {
          const img = new Image();
          img.src = personImage;
          img.onload = () => {
            const aspect = img.width / img.height;
            let scaleMultiplier = personAutoAdjust ? 1 : (personScale / 100);
            const targetH = height * 0.85 * scaleMultiplier;
            const targetW = targetH * aspect;
            
            let offsetShiftY = personAutoAdjust ? 0 : (personOffsetY * 2);
            const xPos = personPosition === 'Kiri' ? 50 : personPosition === 'Kanan' ? width - targetW - 50 : (width - targetW) / 2;
            ctx.drawImage(img, xPos, height - targetH + offsetShiftY, targetW, targetH);
            renderProductImagesAndText(ctx, width, height);
          };
        } else {
          renderProductImagesAndText(ctx, width, height);
        }
      };

      const renderProductImagesAndText = (ctx, width, height) => {
        if (productImages.length > 0) {
          let loaded = 0;
          const totalProds = productImages.length;
          productImages.forEach((pImgSrc, idx) => {
            const pImg = new Image();
            pImg.src = pImgSrc;
            pImg.onload = () => {
              loaded++;
              let pScaleMult = productAutoAdjust ? 1 : (productScale / 100);
              const pSize = Math.floor(height * 0.28 * pScaleMult);
              
              let pX = personPosition === 'Kiri' ? width - pSize - 60 - (idx * 35) : 60 + (idx * 35);
              let pY = height - pSize - 40 - (idx * 15);

              if (!productAutoAdjust) {
                if (productPosition.includes('Atas')) pY = 40 + (idx * 20);
                if (productPosition.includes('Tengah')) pY = (height - pSize) / 2;
                if (productPosition.includes('Kiri')) pX = 40 + (idx * 30);
                if (productPosition.includes('Kanan')) pX = width - pSize - 40 - (idx * 30);
              }

              ctx.save();
              ctx.shadowColor = 'rgba(0,0,0,0.6)';
              ctx.shadowBlur = 15;
              ctx.drawImage(pImg, pX, pY, pSize, pSize);
              ctx.restore();

              if (loaded === totalProds) {
                renderTextOnCanvas(ctx, width, height);
              }
            };
          });
        } else {
          renderTextOnCanvas(ctx, width, height);
        }
      };

      const renderTextOnCanvas = (ctx, width, height) => {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 25;
        ctx.shadowOffsetX = 6;
        ctx.shadowOffsetY = 6;

        ctx.font = `900 ${Math.floor(height * 0.09)}px sans-serif`;
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = personPosition === 'Kiri' ? 'right' : 'left';
        const textX = personPosition === 'Kiri' ? width - 80 : 80;

        const titleLines = wrapText(ctx, title.toUpperCase(), width * 0.5);
        let startY = height * 0.35;
        
        titleLines.forEach((line) => {
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 14;
          ctx.strokeText(line, textX, startY);
          
          ctx.fillStyle = '#FFDD00';
          ctx.fillText(line, textX, startY);
          startY += height * 0.11;
        });

        if (subtitle) {
          ctx.font = `700 ${Math.floor(height * 0.05)}px sans-serif`;
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 8;
          ctx.strokeText(subtitle, textX, startY + 10);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText(subtitle, textX, startY + 10);
        }

        const dataUrl = ctx.canvas.toDataURL('image/png');
        setGeneratedImageUrl(dataUrl);
        saveToHistory(dataUrl, generatedPrompt || "Canvas Rendered Thumbnail");
      };

      const wrapText = (ctx, text, maxWidth) => {
        const words = text.split(' ');
        const lines = [];
        let currentLine = words[0] || "";

        for (let i = 1; i < words.length; i++) {
          const word = words[i];
          const width = ctx.measureText(currentLine + " " + word).width;
          if (width < maxWidth) {
            currentLine += " " + word;
          } else {
            lines.push(currentLine);
            currentLine = word;
          }
        }
        lines.push(currentLine);
        return lines;
      };

      const handleDownload = (format) => {
        if (!generatedImageUrl) return;

        const link = document.createElement('a');
        link.download = `AI-Thumbnail-${Date.now()}.${format}`;

        if (format === 'png' || generatedImageUrl.startsWith('data:image/png')) {
          link.href = generatedImageUrl;
          link.click();
        } else {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = generatedImageUrl;
          img.onload = () => {
            const cvs = document.createElement('canvas');
            cvs.width = img.width;
            cvs.height = img.height;
            const ctx = cvs.getContext('2d');
            if (format === 'jpg') {
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, cvs.width, cvs.height);
            }
            ctx.drawImage(img, 0, 0);
            const mime = format === 'webp' ? 'image/webp' : 'image/jpeg';
            link.href = cvs.toDataURL(mime, 0.92);
            link.click();
          };
        }
      };

      const copyPromptToClipboard = async () => {
        if (!generatedPrompt) return;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(generatedPrompt);
            setCopiedPrompt(true);
            setTimeout(() => setCopiedPrompt(false), 2000);
            return;
          }
          throw new Error("Clipboard API unavailable");
        } catch (err) {
          try {
            const textArea = document.createElement("textarea");
            textArea.value = generatedPrompt;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            if (successful) {
              setCopiedPrompt(true);
              setTimeout(() => setCopiedPrompt(false), 2000);
            }
          } catch (fallbackErr) {
            console.error("Failed to copy prompt:", fallbackErr);
          }
        }
      };

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100 font-sans flex flex-col selection:bg-amber-500 selection:text-zinc-950">
          
          {/* Top Navbar */}
          <header className="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-md sticky top-0 z-40 px-4 lg:px-8 py-3 flex items-center justify-between">

                  <LucideIcon name="sparkles" className="w-5 h-5 text-amber-400 animate-pulse" />
                </div>
              </div>
              <div>
                <h1 className="text-xl font-black tracking-tight bg-gradient-to-r from-amber-400 via-rose-300 to-indigo-300 bg-clip-text text-transparent">
                  AI Thumbnail Maker
                </h1>
                <p className="text-xs text-zinc-400 font-medium">Create Viral Thumbnails with AI</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex items-center bg-zinc-900 p-1 rounded-xl border border-zinc-800">
              <button

                className={`flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${
                  activeTab === 'editor' ? 'bg-amber-500 text-zinc-950 shadow' : 'text-zinc-400 hover:text-zinc-200'
                }`}
              >
                <LucideIcon name="wand-2" className="w-4 h-4" />
                Studio Editor
              </button>
              <button
                onClick={() => setActiveTab('templates')}
                className={`flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${
                  activeTab === 'templates' ? 'bg-amber-500 text-zinc-950 shadow' : 'text-zinc-400 hover:text-zinc-200'
                }`}
              >
                <LucideIcon name="layout" className="w-4 h-4" />
                Presets & Templates
              </button>
              <button
                onClick={() => setActiveTab('history')}
                className={`flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all ${
                  activeTab === 'history' ? 'bg-amber-500 text-zinc-950 shadow' : 'text-zinc-400 hover:text-zinc-200'
                }`}
              >
                <LucideIcon name="history" className="w-4 h-4" />
                History ({historyList.length})
              </button>
            </div>

            {/* API Badge indicator */}
            <div className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-zinc-900/90 border border-zinc-800 rounded-lg text-xs font-medium text-zinc-400">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
              <span>Google Gemini AI Ready</span>

                          <p className="text-xs font-medium text-zinc-400">Belum ada thumbnail yang dibuat</p>
                          <p className="text-[10px] text-zinc-600 mt-1">Klik "Tahap 2: Generate Thumbnail" untuk mulai</p>
                        </div>
                      )}
                    </div>

                    {generatedImageUrl && (
                      <div className="space-y-2 pt-1">
                        <label className="block text-[11px] font-bold text-zinc-400">Download Gambar:</label>
                        <div className="grid grid-cols-3 gap-2">
                          <button onClick={() => handleDownload('png')} className="py-2 bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 text-zinc-200 text-xs font-extrabold rounded-xl flex items-center justify-center gap-1 transition-all">
                            <LucideIcon name="download" className="w-3.5 h-3.5" /> PNG
                          </button>
                          <button onClick={() => handleDownload('jpg')} className="py-2 bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 text-zinc-200 text-xs font-extrabold rounded-xl flex items-center justify-center gap-1 transition-all">
                            <LucideIcon name="download" className="w-3.5 h-3.5" /> JPG
                          </button>
                          <button onClick={() => handleDownload('webp')} className="py-2 bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 text-zinc-200 text-xs font-extrabold rounded-xl flex items-center justify-center gap-1 transition-all">
                            <LucideIcon name="download" className="w-3.5 h-3.5" /> WEBP
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-sm text-zinc-200 flex items-center gap-2">
                        <LucideIcon name="wand-2" className="w-4 h-4 text-amber-400" /> Output Prompt AI
                      </h3>
                      <div className="flex items-center gap-1.5">
                        <button onClick={handleEnhancePrompt} disabled={isEnhancingPrompt} className="px-2.5 py-1 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-lg text-xs font-bold flex items-center gap-1 transition-all" title="Perkaya prompt untuk CTR lebih tinggi">
                          {isEnhancingPrompt ? <LucideIcon name="refresh-cw" className="w-3 h-3 animate-spin" /> : <LucideIcon name="sparkles" className="w-3 h-3" />}
                          Boost
                        </button>
                        <button onClick={copyPromptToClipboard} disabled={!generatedPrompt} className="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs font-bold flex items-center gap-1 transition-all">
                          {copiedPrompt ? <LucideIcon name="check" className="w-3 h-3 text-emerald-400" /> : <LucideIcon name="copy" className="w-3 h-3" />}
                          {copiedPrompt ? 'Copied' : 'Copy'}
                        </button>
                      </div>
                    </div>

                    <textarea readOnly rows={6} value={generatedPrompt} placeholder="Klik 'Tahap 1: Generate Prompt AI' untuk melihat prompt terperinci yang dibuat oleh Google Gemini..." className="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs font-mono text-zinc-300 focus:outline-none resize-none" />
                  </div>
                </div>
              </>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-zinc-800/80 py-4 px-6 text-center text-xs text-zinc-500 mt-auto flex flex-col md:flex-row items-center justify-between gap-2">
            <div>
              <span className="font-bold text-zinc-400">AI Thumbnail Maker</span> &copy; 2026. Powered by Google Gemini & Image Generation API.
            </div>
            <div className="flex items-center gap-4 text-zinc-400">
              <a href="https://www.buanamedia.my.id" target="_blank" rel="noopener noreferrer" className="text-amber-400 hover:text-amber-300 font-bold flex items-center gap-1 transition-colors">
                By Buana Media <LucideIcon name="external-link" className="w-3.5 h-3.5" />
              </a>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

<!-- 1. Skrip Modal Popup QRIS -->
    <script src="https://raw.githack.com/buanamedia/qris/main/qris-popup.js?v=300"></script>

    <!-- 2. Skrip Tombol Melayang (Floating Button Kiri Bawah) -->
    <script src="https://raw.githack.com/buanamedia/qris/main/qris-floating.js?v=300"></script>

    <!-- 3. Skrip Banner Realtime Firebase (Wajib type="module") -->
    <script type="module" src="https://raw.githack.com/buanamedia/qris/main/qris-banner.js?v=300"></script>

    <!-- Pemicu Otomatis Buka Modal saat Awal Dimuat -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (typeof window.openQrisModal === 'function') {
                    window.openQrisModal();
                }
            }, 300);
        });
    </script>
  
</body>
</html>
